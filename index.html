<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de Tênis</title><style>
:root{--bg:#f6f6f4;--fg:#1c1c1a;--card:#fff;--mut:#6b6b66;--bd:#e2e2dc;--ok:#1a7f4b;--x:#b3402a;--acc:#1d4ed8;--img:#f1f1ee}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecece8;--card:#212120;--mut:#9a9a93;--bd:#34342f;--ok:#4cc38a;--x:#ef8a73;--acc:#7aa2ff;--img:#2b2b29}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:1280px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0}.peq{font-size:12.5px;color:var(--mut);margin:2px 0}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}select,label.f{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;color:var(--fg);font:inherit}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:820px){.grade{grid-template-columns:1fr}}
section.marca{margin:22px 0 8px}section.marca h2{font-size:19px;margin:0 0 10px;text-transform:capitalize;display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--bd);padding-bottom:4px}section.marca h2 small{font-size:13px;color:var(--mut);font-weight:400;text-transform:none}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.nav a{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:3px 12px;text-decoration:none;font-size:13px;color:var(--fg);text-transform:capitalize}
tr.sem td{color:var(--mut);font-size:12.5px}tr.sem a{font-size:12.5px}.vend{font-size:11.5px;color:var(--x)}
article{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
article header{display:flex;gap:10px;align-items:center}.tit{flex:1;min-width:0}h3{margin:0;font-size:16px}
.foto{flex:none;width:76px;height:76px;border-radius:10px;border:1px solid var(--bd);background:var(--img);padding:0;overflow:hidden;cursor:zoom-in}
.foto img{width:100%;height:100%;object-fit:contain;display:block}.foto.vazia{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);cursor:default}
.cores{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.cor{width:58px;padding:3px;border:2px solid var(--bd);border-radius:9px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit;text-align:center}
.cor.on{border-color:var(--acc)}.cor .im{display:block;width:100%;height:40px;background:var(--img);border-radius:6px;overflow:hidden}.cor img{width:100%;height:100%;object-fit:contain}
.cor b{display:block;font-size:11.5px;line-height:1.2;margin-top:2px}.cor small{display:block;font-size:10px;color:var(--ok)}.cor.barata{border-color:var(--ok)}.cor.barata.on{border-color:var(--acc)}
table{width:100%;border-collapse:collapse;margin-top:6px}th{font-size:11px;text-align:left;color:var(--mut);font-weight:500}
td{padding:5px 4px;border-top:1px solid var(--bd);vertical-align:middle}td.num{white-space:nowrap}s{color:var(--mut);font-size:12px}em{color:var(--ok);font-style:normal;font-size:12px}
.t{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 4px;font-size:12px;border:1px solid var(--bd)}.t.ok{color:var(--ok);border-color:var(--ok)}.t.x{color:var(--x);text-decoration:line-through}.t.na{color:var(--mut)}
.selo{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;margin:2px 4px 0 0;background:var(--bd)}.selo.alvo{background:var(--ok);color:#fff}.selo.baixou{background:var(--acc);color:#fff}
.dif{font-size:12.5px;margin:4px 0}.dif b{color:var(--ok)}
.hist{width:70px;color:var(--acc)}.spark{width:64px;height:24px}a{color:var(--acc)}
dialog{border:0;border-radius:14px;padding:14px;width:min(760px,94vw);background:var(--card);color:var(--fg)}dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:16px;margin:0 28px 8px 0}#fechar{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--fg);font-size:26px;cursor:pointer;line-height:1}
#grande{width:100%;max-height:62vh;object-fit:contain;background:var(--img);border-radius:10px;display:block}
#tiras{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}#tiras button{width:72px;height:72px;padding:0;border:2px solid var(--bd);border-radius:8px;background:var(--img);cursor:pointer;overflow:hidden}
#tiras button.on{border-color:var(--acc)}#tiras img{width:100%;height:100%;object-fit:contain}
</style></head><body><main><h1>Radar de Tênis</h1>
<p class="peq" id="resumo"></p>
<div class="filtros">
<select id="marca"><option value="">Todas as marcas</option><option>adidas</option><option>mizuno</option><option>nike</option><option>ous</option><option>puma</option><option>qix</option></select>
<select id="tam"><option value="">Tamanho: 41 ou 42</option><option value="41">Só o 41 disponível</option><option value="42">Só o 42 disponível</option><option value="ambos">41 e 42 disponíveis</option></select>
<select id="gen"><option value="masc">Masculino e unissex</option><option value="todos">Todos os gêneros</option></select>
<label class="f"><input type="checkbox" id="desc"> em desconto</label>
<label class="f"><input type="checkbox" id="alvo"> no meu preço</label></div>
<div class="nav" id="nav"></div><div id="g"></div></main>
<dialog id="dlg"><button id="fechar" aria-label="Fechar">×</button><h2 id="dnome"></h2><img id="grande" alt=""><div id="tiras"></div></dialog>

  +'<table><tr><th>Loja</th><th>Preço</th><th>Tam.</th><th>Histórico</th><th>Lido</th><th></th></tr>'+linhas+'</table></article>'}
function desenhar(){
 const f=F(),itens=[];
 DADOS.forEach(m=>{if(f.marca&&m.marca!=f.marca)return;
  if(!m.cores.length){if(!f.tam&&!f.desc&&!f.alvo)itens.push({m,cores:[],ord:2});return}
  const cs=visiveis(m,f);if(!cs.length)return;
  const desc=Math.max(0,...cs.flatMap(c=>valem(c,f).filter(o=>o.cheio).map(o=>1-o.atual/o.cheio)));
  itens.push({m,cores:cs,ord:1-desc})});
 itens.sort((a,b)=>a.ord-b.ord);
 const ORD=['adidas','nike','puma'],grupos={};
 itens.forEach(x=>{(grupos[x.m.marca||'outras']=grupos[x.m.marca||'outras']||[]).push(x)});
 const marcas=Object.keys(grupos).sort((a,b)=>{const ia=ORD.indexOf(a),ib=ORD.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib)||a.localeCompare(b)});
 q('nav').innerHTML=marcas.map(k=>'<a href="#marca-'+esc(k)+'">'+esc(k)+' ('+grupos[k].length+')</a>').join('');
 q('g').innerHTML=marcas.map(k=>'<section class="marca" id="marca-'+esc(k)+'"><h2>'+esc(k)+' <small>'+grupos[k].length+' modelo'+(grupos[k].length>1?'s':'')+'</small></h2><div class="grade">'+grupos[k].map(x=>card(x.m,f,x.cores)).join('')+'</div></section>').join('');
 q('resumo').textContent='Tamanhos 41 e 42 · atualizado em '+HOJE+' · '+itens.length+' modelos';}
q('g').addEventListener('click',e=>{
 const c=e.target.closest('.cor');if(c){escolha[c.dataset.m]=c.dataset.s;desenhar();return}
 const b=e.target.closest('.foto[data-m]');if(!b)return;
 const f=F(),m=DADOS.find(x=>x.grupo==b.dataset.m),cs=visiveis(m,f);
 const sel=cs.find(x=>x.sku==escolha[m.grupo])||cs.slice().sort((a,b)=>preco(a,f)-preco(b,f))[0];
 q('dnome').textContent=m.nome+(sel.cor?' — '+sel.cor:'');const t=q('tiras');t.innerHTML='';
 sel.fotos.forEach((u,i)=>{const x=document.createElement('button');x.type='button';const im=document.createElement('img');im.src=tira(u);im.referrerPolicy='no-referrer';im.alt='';x.appendChild(im);
  x.onclick=()=>{q('grande').src=big(u);t.querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===x))};t.appendChild(x);if(i==0)x.click()});
 q('dlg').showModal()});
q('fechar').onclick=()=>q('dlg').close();q('dlg').addEventListener('click',e=>{if(e.target==q('dlg'))q('dlg').close()});
['marca','tam','gen','desc','alvo'].forEach(i=>q(i).addEventListener('change',desenhar));
desenhar();
